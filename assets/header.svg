<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03040a"/>
      <stop offset="0.6" stop-color="#080d1f"/>
      <stop offset="1" stop-color="#120a24"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="0.5" stop-color="#7b5cff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <linearGradient id="grid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7b5cff" stop-opacity="0"/>
      <stop offset="1" stop-color="#00f0ff" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00f0ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
    <clipPath id="clip"><rect width="1200" height="340" rx="18"/></clipPath>
    <style>
      .mono{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
      .sans{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
      .name{font-size:68px;font-weight:800;letter-spacing:10px}
      .sub{font-size:17px;letter-spacing:4px;fill:#9fb3ff}
      .hud{font-size:12px;letter-spacing:2px;fill:#5d6b9a}
      .flick{animation:flick 6s infinite}
      @keyframes flick{0%,92%,100%{opacity:1}93%{opacity:.35}94%{opacity:1}96%{opacity:.6}97%{opacity:1}}
      .scan{animation:scan 5s linear infinite}
      @keyframes scan{0%{transform:translateY(-120px)}100%{transform:translateY(360px)}}
      .gridmove{animation:gm 2.4s linear infinite}
      @keyframes gm{0%{transform:translateY(0)}100%{transform:translateY(24px)}}
      .blink{animation:blink 1.1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .pulse{animation:pulse 2s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
      .tw{animation:tw 3s ease-in-out infinite}
      @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
      .type{animation:type 3.2s steps(60) 0.4s both}
      @keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <!-- stars -->
    <g fill="#cfe9ff">
      <circle cx="80" cy="40" r="1.4" class="tw"/><circle cx="210" cy="90" r="1" class="tw" style="animation-delay:.6s"/>
      <circle cx="340" cy="30" r="1.2" class="tw" style="animation-delay:1.2s"/><circle cx="520" cy="60" r="1" class="tw" style="animation-delay:.3s"/>
      <circle cx="700" cy="28" r="1.3" class="tw" style="animation-delay:1.8s"/><circle cx="860" cy="80" r="1" class="tw" style="animation-delay:.9s"/>
      <circle cx="990" cy="35" r="1.4" class="tw" style="animation-delay:1.4s"/><circle cx="1120" cy="95" r="1" class="tw" style="animation-delay:.2s"/>
      <circle cx="150" cy="150" r="1" class="tw" style="animation-delay:2.1s"/><circle cx="1060" cy="160" r="1.1" class="tw" style="animation-delay:2.5s"/>
    </g>
    <!-- sun / horizon glow -->
    <ellipse cx="600" cy="236" rx="420" ry="40" fill="#7b5cff" opacity=".18" filter="url(#soft)"/>
    <!-- perspective grid -->
    <g stroke="url(#grid)" stroke-width="1">
      <line x1="600" y1="236" x2="-600" y2="340"/><line x1="600" y1="236" x2="-300" y2="340"/>
      <line x1="600" y1="236" x2="0" y2="340"/><line x1="600" y1="236" x2="200" y2="340"/>
      <line x1="600" y1="236" x2="400" y2="340"/><line x1="600" y1="236" x2="600" y2="340"/>
      <line x1="600" y1="236" x2="800" y2="340"/><line x1="600" y1="236" x2="1000" y2="340"/>
      <line x1="600" y1="236" x2="1200" y2="340"/><line x1="600" y1="236" x2="1500" y2="340"/>
      <line x1="600" y1="236" x2="1800" y2="340"/>
    </g>
    <svg x="0" y="236" width="1200" height="104" overflow="hidden">
      <g class="gridmove" stroke="#00f0ff" stroke-opacity=".35" stroke-width="1">
        <line x1="0" y1="-20" x2="1200" y2="-20"/><line x1="0" y1="4" x2="1200" y2="4"/>
        <line x1="0" y1="28" x2="1200" y2="28"/><line x1="0" y1="52" x2="1200" y2="52"/>
        <line x1="0" y1="76" x2="1200" y2="76"/><line x1="0" y1="100" x2="1200" y2="100"/>
      </g>
    </svg>
    <line x1="0" y1="236" x2="1200" y2="236" stroke="url(#neon)" stroke-width="2" filter="url(#glow)"/>
    <!-- scan line -->
    <rect class="scan" x="0" y="0" width="1200" height="90" fill="url(#scan)"/>
    <!-- HUD corners -->
    <g stroke="#00f0ff" stroke-width="2" fill="none" opacity=".8">
      <path d="M24 56 V24 H56"/><path d="M1144 24 H1176 V56"/>
      <path d="M24 284 V316 H56"/><path d="M1176 284 V316 H1144"/>
    </g>
    <text x="40" y="46" class="mono hud">SYS://PROFILE.v2026</text>
    <text x="1160" y="46" class="mono hud" text-anchor="end">LAT 10.96°N · LON 74.79°W</text>
    <!-- name -->
    <text x="600" y="128" text-anchor="middle" class="sans name flick" fill="url(#neon)" filter="url(#glow)">CÉSAR MACHADO</text>
    <text x="600" y="128" text-anchor="middle" class="sans name" fill="none" stroke="#ffffff" stroke-opacity=".25" stroke-width=".6">CÉSAR MACHADO</text>
    <!-- subtitle typed -->
    <g class="type">
      <text x="600" y="172" text-anchor="middle" class="mono sub">FULL-STACK DEV  //  LMS ENGINEER  //  AI × EDUCATION  //  CYBERSECURITY</text>
    </g>
    <!-- status -->
    <g transform="translate(600 210)">
      <rect x="-170" y="-15" width="340" height="28" rx="14" fill="#0b1630" stroke="#00f0ff" stroke-opacity=".5"/>
      <circle cx="-148" cy="-1" r="5" fill="#39ff88" class="pulse"/>
      <text x="8" y="4" text-anchor="middle" class="mono" font-size="12.5" letter-spacing="2" fill="#bdf7ff">ONLINE · OPEN TO REMOTE WORK<tspan class="blink" fill="#00f0ff"> ▌</tspan></text>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="338" rx="18" fill="none" stroke="url(#neon)" stroke-opacity=".6" stroke-width="2"/>
</svg>
