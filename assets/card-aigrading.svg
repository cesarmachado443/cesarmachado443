<svg xmlns="http://www.w3.org/2000/svg" width="440" height="210" viewBox="0 0 440 210">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1022"/><stop offset="1" stop-color="#05070f"/></linearGradient>
<style>.m{font-family:'JetBrains Mono','Fira Code',Consolas,monospace}.s{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
.sh{animation:sh 4s ease-in-out infinite}@keyframes sh{0%,100%{stroke-opacity:.35}50%{stroke-opacity:1}}
.dot{animation:p 2s infinite}@keyframes p{50%{opacity:.2}}</style></defs>
<rect x="1" y="1" width="438" height="208" rx="14" fill="url(#g)"/>
<rect x="1" y="1" width="438" height="208" rx="14" fill="none" stroke="#7b5cff" stroke-width="1.6" class="sh"/>
