<text x="24" y="38" class="m" font-size="11" letter-spacing="2" fill="#7b5cff">LLM · EDTECH</text>
<text x="24" y="74" class="s" font-size="24" font-weight="700" fill="#f0f4ff">AI Grading Engine</text>
<text x="24" y="108" class="s" font-size="14" fill="#aab4d4">Self-hosted LLM (Ollama + Qwen3) on Docker</text><text x="24" y="128" class="s" font-size="14" fill="#aab4d4">that grades deliverables against rubrics</text><text x="24" y="148" class="s" font-size="14" fill="#aab4d4">and publishes grades back to Moodle.</text>
